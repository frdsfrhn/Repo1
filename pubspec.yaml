name: property_agent_app
description: "PropertyMate — property agent CRM: leads, voice notes, AI-cleaned transcripts, subscriptions."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.4

  # State management
  provider: ^6.1.2

  # Voice capture — exact-pinned to 6.2.1, not 7.x: the entire record 7.x
  # line requires Dart SDK >=3.12.0, which breaks resolution on any Flutter
  # SDK stuck below that floor (e.g. Flutter 3.27 on a Mac too old for a
  # newer Flutter release's own macOS requirement). 6.2.1 is the newest 6.x
  # release, and only needs Dart >=3.5.0. Earlier 5.x resolutions could pull
  # in a record_linux/record_platform_interface combo that doesn't compile,
  # but that only matters for `flutter build linux`, which this app (no
  # linux/ folder generated) never does — not a risk for the Android/iOS
  # builds this actually ships. Bump past 6.x deliberately, not implicitly.
  record: 6.2.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # Property one-pager photo picker — uses the system photo picker on
  # Android 13+/iOS, which needs no runtime storage/photos permission.
  image_picker: ^1.1.2

  # Subscriptions / paywall
  purchases_flutter: ^8.11.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/icon.png

# Run `dart run flutter_launcher_icons` after `flutter pub get` to (re)generate
# the native Android/iOS launcher icons from assets/branding/icon*.png.
# Source: assets/branding/logo-highres.svg (vector) — regenerate the PNGs
# under assets/branding/ from that SVG if the logo ever changes.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
