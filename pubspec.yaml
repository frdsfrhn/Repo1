name: property_agent_app
description: "PropertyMate — property agent CRM: leads, voice notes, AI-cleaned transcripts, subscriptions."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.4

  # State management
  provider: ^6.1.2

  # Voice capture — pinned to 7.x: earlier 5.x resolutions can pull in a
  # record_linux/record_platform_interface combo that doesn't compile
  # (record_linux missing startStream/hasPermission overrides). 7.x publishes
  # its platform packages together so they stay in sync.
  record: ^7.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # Subscriptions / paywall
  purchases_flutter: ^8.11.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
